# ---------------------------------------------------------------- Velocidade dos diálogos
# 0x8225D580 (caixa de texto), estado 2 = "digitando": "fadds f13,f13,f29" soma o tempo do
# quadro (f29) ao cronômetro da caixa (+0x22C); cada vez que ele passa do intervalo por letra
# (+0x230) uma letra a mais aparece (+0x1F6). O gancho multiplica a parcela do quadro.
[[midasm_hook]]
address = 0x8225D8A8
name = "PcHook_DialogSpeed"
registers = ["f13", "f29", "r31"]
after_instruction = true

# Espera das legendas com tempo: estado 3 da caixa (+0x1C9). Depois de mostrar a página toda,
# caixas com tempo esperam caixa+0x21C segundos (caixa+0x224 quadros x 1/60, 0x82000B98) e
# "fsubs f0,f0,f29" desconta o tempo do quadro; abaixo de 0 a caixa segue para o estado 4.
# O gancho desconta menos nos modos Lenta/Muito lenta (mais tempo para ler).
[[midasm_hook]]
address = 0x8225DB64
name = "PcHook_DialogHold"
registers = ["f0", "f29"]
after_instruction = true

# ---------------------------------------------------------------- Distância de desenho
# 0x82240DE8: retorna (base & 0x3fffffff) << 2 = alcance de surgimento/desenho do ator.
[[midasm_hook]]
address = 0x82240DF8
name = "PcHook_DrawDistance"
registers = ["r3"]
after_instruction = true

# Testes de alcance que o perfil Longe/Total ignora (o patch "Draw Distance Hack" os remove).
[[midasm_hook]]
address = 0x8223F714
name = "PcHook_SkipRangeCheckA"
jump_address_on_true = 0x8223F718

[[midasm_hook]]
address = 0x822A9F84
name = "PcHook_SkipRangeCheckB"
jump_address_on_true = 0x822A9F88

# ---------------------------------------------------------------- Menu de pausa (pedido de 2026-11-12)
# A pausa fica CONTINUAR JOGO, VER TOTAIS, AJUDA E OPÇÕES, CONQUISTAS, SAIR DO JOGO (sair sempre
# por último) e "CONFIGURAÇÕES DE PC" passa para DENTRO de AJUDA E OPÇÕES, com o ícone do Kazooie.
# MECHANICS.md §17. Bytes conferidos no default.xex:
#   0x822DF03C li r6,3 / 0x822DF040 addi r7,..,-0x13C0 (0x822DEC40) / 0x822DF044 li r5,13 /
#   0x822DF048 li r4,1 / 0x822DF04C mr r3,r31 / 0x822DF050 bl 0x822E1380   (CLASSIFICAÇÕES da pausa)
#   0x822DF054 lis r11,.. (CONQUISTAS recarrega r3..r7)
# true em 0x822DF04C pula para 0x822DF054: CLASSIFICAÇÕES não entra na pausa.
[[midasm_hook]]
address = 0x822DF04C
name = "PcHook_PauseSkipLeaderboards"
jump_address_on_true = 0x822DF054

# Página 1 (AJUDA E OPÇÕES, tela+0x154 + 0x2C): COMO JOGAR (6), CONTROLES (7), CONFIGURAÇÕES (8)
# e, conforme o caso, CRÉDITOS (9, título) / DICAS DE JIGGIES (247) / REINSTALAR EXTRAS (347).
# 0x822DF2D0 ("lwz r11,340(r30)") é onde os caminhos do título e da pausa se juntam antes de
# montar a página seguinte: r30 = tela, r31 = página 1, nenhum registrador volátil vivo.
# O gancho acrescenta CONFIGURAÇÕES DE PC no fim da página 1, só na pausa (tela+0x198 != 0).
# Pedido de 2026-11-12 (MECHANICS.md §18): também monta a página 7 (CONFIGURAÇÕES DE PC dentro
# do menu do jogo) com o mesmo layout da página que o jogo acabou de montar: r22 = y inicial,
# r23 = passo, r24 = x, f27 = escala, f31 = atraso por entrada (os mesmos registradores que o
# montador grava em 0x826A5ABC/0x826A5AA0/0x826A5AA8/0x826A5AB0/0x826A5AA4 antes de cada página).
[[midasm_hook]]
address = 0x822DF2D0
name = "PcHook_HelpPageBuilt"
registers = ["r30", "r31", "r22", "r23", "r24", "f27", "f31"]

# ---------------------------------------------------------------- Páginas de PC dentro do menu do jogo
# Pedido de 2026-11-12: as opções do F1 ficam no menu do PRÓPRIO jogo, não numa janela por cima.
# MECHANICS.md §18. O vetor de páginas da tela tem 12 (0x822DB640 aloca 528 bytes); o montador
# 0x822DEE60 monta 0-6 e 8-11 e a 7 fica livre para as Configurações de PC.
# 0x822E3228 = estado 8 do menu (troca de página). Bytes conferidos no default.xex:
#   0x822E327C 816B0028 lwz r11,40(r11)  (indo: página-alvo da entrada sob o cursor)
#   0x822E3294 816B002C lwz r11,44(r11)  (voltando com B: página de volta da entrada)
#   0x822E3298 917F002C stw r11,44(r31)  <- gancho ANTES: r11 = página nova, tela+0x2C = antiga
#   0x822E32BC 7FE3FB78 mr r3,r31 ... bl 0x822DBFA0 (linhas da página nova) e estado 4 (cursor)
# O gancho monta a página 7 para a vista certa (raiz ou seção) antes de o jogo lê-la, e o F1
# troca r11 por 7 para abrir as Configurações de PC de qualquer página do menu.
[[midasm_hook]]
address = 0x822E3298
name = "PcHook_MenuPageSwitch"
registers = ["r11", "r31"]

# 0x822DC728 = callback por quadro da página CONFIGURAÇÕES do jogo (página 2: volumes com
# esquerda/direita). Só é chamado pelo ponteiro página+0x24 (0x822E2860/0x822E23A8/0x822E3150),
# nenhum 'bl' direto. A página 7 aponta para ele também: o gancho trata a página 7 (avisos de
# botão, esquerda/direita trocam o valor) e devolve true; na página 2 devolve false (original).
[[midasm_hook]]
address = 0x822DC728
name = "PcHook_PcPageTick"
registers = ["r3"]
return_on_true = true

# ---------------------------------------------------------------- Textos (entrada de PC nos menus)
# 0x822E9C28 = GetString(id) (tabela de ponteiros de X360_strings.dat em 0x826A60E8). Só para o
# id novo 0x0F00 (fora dos 1521 textos) devolve "CONFIGURAÇÕES DE PC"; os textos do jogo não mudam.
# Registra (id, chamador) para a sonda --probe-menu.
[[midasm_hook]]
address = 0x822E9C28
name = "PcHook_GetString"
registers = ["r3", "lr"]
return_on_true = true

# ---------------------------------------------------------------- Menu principal (título, antes do save)
# Pedido da pessoa (2026-11-11): no menu principal, CLASSIFICAÇÕES sai; "CONFIGURAÇÃO DA
# RECOMPILAÇÃO" (abre o mesmo menu do F1) fica logo ACIMA de "SAIR PARA O DESKTOP", que é o
# antigo "VOLTAR À BIBLIOTECA DE JOGOS" (agora fecha o jogo). O menu de pausa não muda.
# Ordem final: JOGAR, CONQUISTAS, AJUDA E OPÇÕES, CONFIGURAÇÃO DA RECOMPILAÇÃO, SAIR PARA O DESKTOP.
# Caminho do título em 0x822DEE60 (tela+0x198 = 0), bytes conferidos no default.xex:
#   0x822DF090 li r6,3 / 0x822DF094 addi r7,..,-0x13C0 (0x822DEC40) / 0x822DF098 li r5,13 /
#   0x822DF09C li r4,1 / 0x822DF0A0 mr r3,r31 / 0x822DF0A4 bl 0x822E1380   (CLASSIFICAÇÕES)
#   0x822DF0A8 lis r11,.. (a próxima entrada recarrega r3..r7: nada depende do retorno)
# Em 0x822DF0A0 o gancho pula para 0x822DF0A8: CLASSIFICAÇÕES não é registrada. Como cada
# entrada guarda sua altura ao ser criada (0x822E5740, MECHANICS §13), as seguintes sobem uma
# linha sem buraco.
[[midasm_hook]]
address = 0x822DF0A0
name = "PcHook_TitleSkipLeaderboards"
jump_address_on_true = 0x822DF0A8

#   0x822DF108 li r6,-1 / 0x822DF10C addi r7,..,-0x12C0 (0x822DED40) / 0x822DF110 li r4,5
#   (VOLTAR À BIBLIOTECA DE JOGOS); 0x822DF114 (li r5,0xAD) é alvo do caminho da pausa, então o
#   gancho fica DEPOIS de 0x822DF110, que só o título executa. r31 = página 0. O gancho
#   registra antes a entrada da recompilação (0x822E1380, salvando os registradores voláteis
#   vivos r4/r6/r7) e depois troca o id do texto da saída.
[[midasm_hook]]
address = 0x822DF110
name = "PcHook_TitleExitEntry"
registers = ["r4", "r31"]
after_instruction = true

# 0x822DED40 = ação de VOLTAR À BIBLIOTECA DE JOGOS: 0x822DBC18(tela, 7) e callback em
# tela+0x22C = 0x822DE260 (jogo completo, 0x8227E6B0 != 0). 0x822DE260 abre a confirmação do
# próprio jogo: título GetString(5) (chamada com retorno em 0x822DE290), pergunta GetString(53)
# "VOCÊ TEM CERTEZA?", botão 0 -> 0x822DDBA0 (tela+0x22C = 0x822DD720, "sair") e botão 1 ->
# 0x822DDAD8 (tela+0x22C = 0x822DDA70, volta ao menu). MECHANICS.md §15.
# O gancho só marca que a confirmação veio do menu principal; o original continua.
[[midasm_hook]]
address = 0x822DED40
name = "PcHook_TitleExitSelect"
registers = ["r3"]
return_on_true = true

# 0x822DD720 = "sair" confirmado: no original chama 0x825B1EB8("XLNI_DASH_ARCADE") (painel do
# console). Só quando a confirmação veio de SAIR PARA O DESKTOP, o port fecha o programa pelo
# caminho normal e não executa o original. Chamado por 0x822E2538 com r3 = tela.
[[midasm_hook]]
address = 0x822DD720
name = "PcHook_ExitConfirmed"
registers = ["r3"]
return_on_true = true

# 0x822DDA70 = "voltar" da confirmação (usado por várias caixas do jogo): desarma a marca.
[[midasm_hook]]
address = 0x822DDA70
name = "PcHook_ExitCancelled"
registers = ["r3"]

# 0x822DD628 = ação de CONQUISTAS (título e pausa): FUN_8227EED0 (só lê o jogador ativo,
# *(0x8269EE90+0x14), 0x822E5F08) + XamShowAchievementsUI (0x825B1F60), o painel do Xbox LIVE,
# que não existe no PC. Com a camada de PC, o gancho abre a lista de conquistas do PC dentro do
# menu do jogo (pc_achievements.h, M04 C-6) e pula o original; sem ela, segue o original.
[[midasm_hook]]
address = 0x822DD628
name = "PcHook_AchievementsSelect"
registers = ["r3"]
return_on_true = true

# 0x822DEC40 = ação de CLASSIFICAÇÕES (página-alvo 3) e também da entrada nova (página-alvo -1).
# O original confere o perfil Xbox Live (byte 0x8269EF20) e, sem ele, abre a tela "ESTE RECURSO
# EXIGE UM PERFIL ... XBOX LIVE" (0x822DE7E8). O gancho só age na entrada nova (abre o menu
# Configurações de PC; o menu do jogo continua onde estava); CLASSIFICAÇÕES segue o original.
[[midasm_hook]]
address = 0x822DEC40
name = "PcHook_LeaderboardsSelect"
registers = ["r3"]
return_on_true = true
