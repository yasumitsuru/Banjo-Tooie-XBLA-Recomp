# ---------------------------------------------------------------- Velocidade dos diálogos
# 0x8225D580 (caixa de texto), estado 2 = "digitando": "fadds f13,f13,f29" soma o tempo do
# quadro (f29) ao cronômetro da caixa (+0x22C); cada vez que ele passa do intervalo por letra
# (+0x230) uma letra a mais aparece (+0x1F6). O gancho multiplica a parcela do quadro.
[[midasm_hook]]
address = 0x8225D8A8
name = "PcHook_DialogSpeed"
registers = ["f13", "f29", "r31"]
after_instruction = true

# ---------------------------------------------------------------- Distância de desenho
# 0x82240DE8: retorna (base & 0x3fffffff) << 2 = alcance de surgimento/desenho do ator.
[[midasm_hook]]
address = 0x82240DF8
name = "PcHook_DrawDistance"
registers = ["r3"]
after_instruction = true

# Testes de alcance que o perfil Longe/Total ignora (o patch "Draw Distance Hack" os remove).
[[midasm_hook]]
address = 0x8223F714
name = "PcHook_SkipRangeCheckA"
jump_address_on_true = 0x8223F718

[[midasm_hook]]
address = 0x822A9F84
name = "PcHook_SkipRangeCheckB"
jump_address_on_true = 0x822A9F88

# ---------------------------------------------------------------- Entrada de PC no menu de pausa
# Banjo 3: "CONFIGURAÇÕES DE PC" é ACRESCENTADA no fim do menu de pausa (7ª entrada), sem
# renomear CLASSIFICAÇÕES da pausa (o menu de título tem ganchos próprios, mais abaixo).
# 0x822DEE60 monta os menus; a chamada em
# 0x822DF11C registra a última entrada (SAIR DO JOGO na pausa). Antes de 0x822DF120
# ("lwz r11,340(r30)"): r30 = tela, r31 = página 0, nenhum registrador volátil vivo.
[[midasm_hook]]
address = 0x822DF120
name = "PcHook_PauseMenuBuilt"
registers = ["r30", "r31"]

# ---------------------------------------------------------------- Textos (entrada de PC nos menus)
# 0x822E9C28 = GetString(id) (tabela de ponteiros de X360_strings.dat em 0x826A60E8). Só para o
# id novo 0x0F00 (fora dos 1521 textos) devolve "CONFIGURAÇÕES DE PC"; os textos do jogo não mudam.
# Registra (id, chamador) para a sonda --probe-menu.
[[midasm_hook]]
address = 0x822E9C28
name = "PcHook_GetString"
registers = ["r3", "lr"]
return_on_true = true

# ---------------------------------------------------------------- Menu principal (título, antes do save)
# Pedido da pessoa (2026-11-11): no menu principal, CLASSIFICAÇÕES sai; "CONFIGURAÇÃO DA
# RECOMPILAÇÃO" (abre o mesmo menu do F1) fica logo ACIMA de "SAIR PARA O DESKTOP", que é o
# antigo "VOLTAR À BIBLIOTECA DE JOGOS" (agora fecha o jogo). O menu de pausa não muda.
# Ordem final: JOGAR, CONQUISTAS, AJUDA E OPÇÕES, CONFIGURAÇÃO DA RECOMPILAÇÃO, SAIR PARA O DESKTOP.
# Caminho do título em 0x822DEE60 (tela+0x198 = 0), bytes conferidos no default.xex:
#   0x822DF090 li r6,3 / 0x822DF094 addi r7,..,-0x13C0 (0x822DEC40) / 0x822DF098 li r5,13 /
#   0x822DF09C li r4,1 / 0x822DF0A0 mr r3,r31 / 0x822DF0A4 bl 0x822E1380   (CLASSIFICAÇÕES)
#   0x822DF0A8 lis r11,.. (a próxima entrada recarrega r3..r7: nada depende do retorno)
# Em 0x822DF0A0 o gancho pula para 0x822DF0A8: CLASSIFICAÇÕES não é registrada. Como cada
# entrada guarda sua altura ao ser criada (0x822E5740, MECHANICS §13), as seguintes sobem uma
# linha sem buraco.
[[midasm_hook]]
address = 0x822DF0A0
name = "PcHook_TitleSkipLeaderboards"
jump_address_on_true = 0x822DF0A8

#   0x822DF108 li r6,-1 / 0x822DF10C addi r7,..,-0x12C0 (0x822DED40) / 0x822DF110 li r4,5
#   (VOLTAR À BIBLIOTECA DE JOGOS); 0x822DF114 (li r5,0xAD) é alvo do caminho da pausa, então o
#   gancho fica DEPOIS de 0x822DF110, que só o título executa. r31 = página 0. O gancho
#   registra antes a entrada da recompilação (0x822E1380, salvando os registradores voláteis
#   vivos r4/r6/r7) e depois troca o id do texto da saída.
[[midasm_hook]]
address = 0x822DF110
name = "PcHook_TitleExitEntry"
registers = ["r4", "r31"]
after_instruction = true

# 0x822DED40 = ação de VOLTAR À BIBLIOTECA DE JOGOS: 0x822DBC18(tela, 7) e callback em
# tela+0x22C = 0x822DE260 (jogo completo, 0x8227E6B0 != 0). 0x822DE260 abre a confirmação do
# próprio jogo: título GetString(5) (chamada com retorno em 0x822DE290), pergunta GetString(53)
# "VOCÊ TEM CERTEZA?", botão 0 -> 0x822DDBA0 (tela+0x22C = 0x822DD720, "sair") e botão 1 ->
# 0x822DDAD8 (tela+0x22C = 0x822DDA70, volta ao menu). MECHANICS.md §15.
# O gancho só marca que a confirmação veio do menu principal; o original continua.
[[midasm_hook]]
address = 0x822DED40
name = "PcHook_TitleExitSelect"
registers = ["r3"]
return_on_true = true

# 0x822DD720 = "sair" confirmado: no original chama 0x825B1EB8("XLNI_DASH_ARCADE") (painel do
# console). Só quando a confirmação veio de SAIR PARA O DESKTOP, o port fecha o programa pelo
# caminho normal e não executa o original. Chamado por 0x822E2538 com r3 = tela.
[[midasm_hook]]
address = 0x822DD720
name = "PcHook_ExitConfirmed"
registers = ["r3"]
return_on_true = true

# 0x822DDA70 = "voltar" da confirmação (usado por várias caixas do jogo): desarma a marca.
[[midasm_hook]]
address = 0x822DDA70
name = "PcHook_ExitCancelled"
registers = ["r3"]

# 0x822DEC40 = ação de CLASSIFICAÇÕES (página-alvo 3) e também da entrada nova (página-alvo -1).
# O original confere o perfil Xbox Live (byte 0x8269EF20) e, sem ele, abre a tela "ESTE RECURSO
# EXIGE UM PERFIL ... XBOX LIVE" (0x822DE7E8). O gancho só age na entrada nova (abre o menu
# Configurações de PC; o menu do jogo continua onde estava); CLASSIFICAÇÕES segue o original.
[[midasm_hook]]
address = 0x822DEC40
name = "PcHook_LeaderboardsSelect"
registers = ["r3"]
return_on_true = true
