# ---------------------------------------------------------------- Velocidade dos diálogos
# 0x8225D580 (caixa de texto), estado 2 = "digitando": "fadds f13,f13,f29" soma o tempo do
# quadro (f29) ao cronômetro da caixa (+0x22C); cada vez que ele passa do intervalo por letra
# (+0x230) uma letra a mais aparece (+0x1F6). O gancho multiplica a parcela do quadro.
[[midasm_hook]]
address = 0x8225D8A8
name = "PcHook_DialogSpeed"
registers = ["f13", "f29", "r31"]
after_instruction = true

# ---------------------------------------------------------------- Distância de desenho
# 0x82240DE8: retorna (base & 0x3fffffff) << 2 = alcance de surgimento/desenho do ator.
[[midasm_hook]]
address = 0x82240DF8
name = "PcHook_DrawDistance"
registers = ["r3"]
after_instruction = true

# Testes de alcance que o perfil Longe/Total ignora (o patch "Draw Distance Hack" os remove).
[[midasm_hook]]
address = 0x8223F714
name = "PcHook_SkipRangeCheckA"
jump_address_on_true = 0x8223F718

[[midasm_hook]]
address = 0x822A9F84
name = "PcHook_SkipRangeCheckB"
jump_address_on_true = 0x822A9F88

# ---------------------------------------------------------------- Textos (entrada de PC nos menus)
# 0x822E9C28 = GetString(id) (tabela de ponteiros de X360_strings.dat em 0x826A60E8). Para o
# id 1 ("CLASSIFICAÇÕES", placares que exigem Xbox Live) devolve "CONFIGURAÇÕES DE PC".
# Registra (id, chamador) para a sonda --probe-menu.
[[midasm_hook]]
address = 0x822E9C28
name = "PcHook_GetString"
registers = ["r3", "lr"]
return_on_true = true

# 0x822DEC40 = ação da entrada id 1 (registrada por 0x822E1380 no menu de título, 0x822DF094,
# e no de pausa, 0x822DF040). O original confere o perfil Xbox Live (byte 0x8269EF20) e, sem
# ele, abre a tela "ESTE RECURSO EXIGE UM PERFIL ... XBOX LIVE" (0x822DE7E8). Com a entrada de
# PC ligada, a ação abre o menu Configurações de PC e o menu do jogo continua onde estava.
[[midasm_hook]]
address = 0x822DEC40
name = "PcHook_LeaderboardsSelect"
registers = ["r3"]
return_on_true = true
