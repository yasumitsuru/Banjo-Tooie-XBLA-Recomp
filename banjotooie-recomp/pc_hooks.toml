# Ganchos do port PT-BR. A versão do usuário tem o mesmo layout da retail (endereços = patch Xenia 58410955).
# Cada gancho chama uma função C++ do PC (src/pc/pc_hooks.cpp) que consulta as
# Configurações de PC. Com tudo em "Original", o jogo se comporta como no Xbox 360.
# Origem de cada endereço: MECHANICS.md (seção "Tempo de quadro" e "Distância de desenho").

# ---------------------------------------------------------------- 60 FPS
# 0x82276E28 (time_setFrameStep): "li r9,2" -> passo de quadros = 2 VBlanks (30 FPS).
[[midasm_hook]]
address = 0x82276E34
name = "PcHook_FrameStep"
registers = ["r9"]
after_instruction = true

# 0x82221648 = quadro principal do jogo; depois de "subi r31,r11,0x1398" (0x8222165C) nenhum
# registrador volátil está vivo. A sonda --probe-dd-worlds chama a rotina de viagem do jogo
# (0x82248810) daqui, antes das atualizações dos objetos, como faria um objeto do jogo.
[[midasm_hook]]
address = 0x8222165C
name = "PcHook_FrameStart"
after_instruction = true

# 0x822F9DA0..: monta o pacote de troca de tela; "lwz r11,0x351c(r31)" = intervalo de apresentação.
[[midasm_hook]]
address = 0x822F9F18
name = "PcHook_PresentInterval"
registers = ["r11"]
after_instruction = true

